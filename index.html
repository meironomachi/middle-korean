<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중세 한국어 사전</title>
<meta name="description" content="후기 중세국어(15~16세기)의 어휘·조사·어미를 찾아보는 사전">
<style>
/* 옛한글: 완성형에 없는 글자라 첫가끝 자모(U+1100~)로 적혀 있음.
   설치된 글꼴을 먼저 쓰고, fonts/ 에 웹폰트를 넣어 두면 그것도 씀. */
@font-face{
  font-family:"YetHangul";
  src:local("NanumBarunGothic YetHangul"), local("나눔바른고딕 옛한글"),
      local("HCR Batang"), local("함초롬바탕"),
      url("fonts/NanumBarunGothic-YetHangul.woff2") format("woff2"),
      url("fonts/NanumBarunGothic-YetHangul.ttf") format("truetype");
  font-display:swap;
}
:root{
  --bg:#faf9f6; --paper:#fff; --ink:#1b1c1f; --muted:#64676f; --line:#e3e0d9; --soft:#f1efe9;
  --accent:#6d28d9; --accent-soft:#f3edff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131418; --paper:#1c1e23; --ink:#eceae6; --muted:#a2a4ac; --line:#2e313a; --soft:#23262c;
  --accent:#a78bfa; --accent-soft:#2a2440; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131418; --paper:#1c1e23; --ink:#eceae6; --muted:#a2a4ac; --line:#2e313a; --soft:#23262c;
  --accent:#a78bfa; --accent-soft:#2a2440; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;word-break:keep-all;
  font-family:"YetHangul",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.mk{font-family:"YetHangul",serif}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 72px}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:30px 0 22px;margin-bottom:22px}
h1{margin:0 0 4px;font-size:clamp(24px,5vw,34px);font-weight:800;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:14.5px}
.tabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;
  padding:6px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{color:var(--muted);font-size:13.5px;white-space:nowrap}
.entry{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.hw{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.hw b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.hw .written{font-size:18px;color:var(--muted)}
.yale{font-size:13.5px;color:var(--muted);font-style:italic;font-weight:400;font-family:ui-serif,Georgia,serif}
.pos{font-size:12px;font-weight:800;background:var(--accent-soft);color:var(--accent);
  padding:2px 9px;border-radius:999px;white-space:nowrap}
.entry ol{margin:8px 0 0;padding-left:20px}
.entry ol li{margin:2px 0;font-size:15px}
.meta{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
mark{background:#ffe8a3;color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] mark,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:#6b5a1f;color:#fff}}
h2{font-size:21px;margin:26px 0 8px;font-weight:800}
h3{font-size:17px;margin:20px 0 6px;font-weight:800;color:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:14.5px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0 16px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
thead th{background:var(--soft);font-size:12.5px;color:var(--muted);font-weight:800;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.f{font-weight:700;white-space:nowrap;font-size:16px}
.ex{color:var(--muted);font-size:13.5px}
.ex b{color:var(--ink)}
.note{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:13.5px;color:var(--muted);margin:14px 0}
.note a{color:var(--accent)}
.hidden{display:none}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>중세 한국어 사전</h1>
  <p>후기 중세국어(15~16세기)의 어휘와 문법을 찾아봅니다.</p>
</div></header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="lex" aria-selected="true">어휘</button>
    <button class="tab" role="tab" data-tab="gram" aria-selected="false">조사·어미</button>
  </div>

  <section id="lex">
    <div class="search">
      <input id="q" type="search" placeholder="중세어·현대어·뜻으로 찾기 (예: ᄒᆞ다, 하다, water)" autocomplete="off">
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </section>

  <section id="gram" class="hidden"></section>

  <footer>
    <p>어휘는 <a href="https://en.wiktionary.org/wiki/Category:Middle_Korean_lemmas" target="_blank" rel="noopener">영어 위키낱말사전</a>,
    문법은 <a href="https://ko.wikipedia.org/wiki/중세_한국어" target="_blank" rel="noopener">한국어 위키백과</a>에서 가져왔습니다.
    두 곳 모두 CC BY-SA 4.0이라 이 사전도 같은 조건으로 둡니다.</p>
    <p>뜻풀이는 영어 원문을 그대로 옮긴 것이 많습니다. 출전과 연도는 문헌에 처음 보이는 때를 가리킵니다.</p>
    <p><span class="mk">ᄒᆞ다</span>, <span class="mk">ᅀᆞᇦ</span> 처럼 현대 한글에 없는 글자는 첫가끝 자모로 적혀 있습니다.
    네모(□)로 보인다면 <b>나눔바른고딕 옛한글</b>이나 <b>함초롬바탕</b> 같은 옛한글 글꼴을 설치해 주세요.</p>
  </footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let LEX = [], GRAM = null;

const norm = (s) => String(s ?? "").toLowerCase();
function hit(e, q) {
  if (!q) return true;
  if (norm(e.headword).includes(q)) return true;
  if ((e.modern || []).some((m) => norm(m).includes(q))) return true;
  return e.senses.some((s) => norm(s.yale).includes(q) || norm(s.written).includes(q)
    || s.glosses.some((g) => norm(g).includes(q)));
}
const hl = (s, q) => {
  const t = esc(s);
  if (!q) return t;
  const i = norm(t).indexOf(q);
  return i < 0 ? t : t.slice(0, i) + "<mark>" + t.slice(i, i + q.length) + "</mark>" + t.slice(i + q.length);
};

function card(e, q) {
  const s0 = e.senses[0] || {};
  return `<article class="entry">
    <div class="hw">
      <b class="mk">${hl(e.headword, q)}</b>
      ${s0.written ? `<span class="written mk">${esc(s0.written)}</span>` : ""}
      ${s0.yale ? `<span class="yale">${esc(s0.yale)}</span>` : ""}
      ${[...new Set(e.senses.map((s) => s.pos))].map((p) => `<span class="pos">${esc(p)}</span>`).join("")}
    </div>
    ${e.senses.map((s) => `<ol>${s.glosses.map((g) => `<li>${hl(g, q)}</li>`).join("")}</ol>`).join("")}
    ${(e.modern || e.attested) ? `<div class="meta">
      ${e.modern ? `<span>현대어 <b class="mk">${e.modern.map((m) => hl(m, q)).join(", ")}</b></span>` : ""}
      ${e.attested ? `<span>출전 <b>${e.attested.map((a) => esc([a.work, a.year].filter(Boolean).join(" ")) ).filter(Boolean).join(" · ")}</b></span>` : ""}
    </div>` : ""}
  </article>`;
}

const LIMIT = 80;
function draw() {
  const q = norm($("#q").value.trim());
  const found = LEX.filter((e) => hit(e, q));
  $("#count").textContent = q ? `${found.length}개` : `전체 ${LEX.length}개`;
  $("#list").innerHTML = found.length
    ? found.slice(0, LIMIT).map((e) => card(e, q)).join("")
      + (found.length > LIMIT ? `<p class="note">${found.length}개 가운데 ${LIMIT}개만 보여 줍니다. 더 좁혀서 찾아 주세요.</p>` : "")
    : `<p class="note">찾는 말이 없습니다.</p>`;
}

function formRows(forms) {
  return forms.map((f) => `<tr>
    <td class="f mk">${esc(f.form)}</td>
    <td>${esc(f.env || "")}${f.yale ? ` <span class="yale">${esc(f.yale)}</span>` : ""}
      ${(f.examples || []).map((x) => `<div class="ex"><b class="mk">${esc(x.mk)}</b> — ${esc(x.ko || "")}${x.src ? ` <i>${esc(x.src)}</i>` : ""}</div>`).join("")}
      ${f.note ? `<div class="ex">${esc(f.note)}</div>` : ""}</td></tr>`).join("");
}

function drawGram() {
  const g = GRAM;
  const tbl = (forms) => `<table><thead><tr><th>꼴</th><th>쓰이는 자리</th></tr></thead><tbody>${formRows(forms)}</tbody></table>`;
  let h = `<h2>조사</h2>`;
  for (const p of g.particles) {
    h += `<h3>${esc(p.name)}${p.modern ? ` <span class="yale">현대어 ${esc(p.modern)}</span>` : ""}</h3>`;
    if (p.note) h += `<p class="ex">${esc(p.note)}</p>`;
    h += tbl(p.forms);
  }
  h += `<h2>선어말어미</h2><p class="ex">어간과 어말어미 사이에 들어갑니다. 붙는 차례: ${g.prefinal_endings.order.map((o) => esc(o.name)).join(" → ")}</p>`;
  for (const it of g.prefinal_endings.items) {
    h += `<h3>${esc(it.name)}${it.modern ? ` <span class="yale">현대어 ${esc(it.modern)}</span>` : ""}</h3>`;
    if (it.meaning) h += `<p class="ex">${esc(it.meaning)}</p>`;
    if (it.origin) h += `<p class="ex">어원: ${esc(it.origin)}</p>`;
    h += tbl(it.forms);
    if (it.later_forms) h += `<p class="ex">${esc(it.later_forms.note)}</p>` + tbl(it.later_forms.forms);
    if (it.note) h += `<p class="ex">${esc(it.note)}</p>`;
  }
  const fe = g.final_endings;
  h += `<h2>어말어미</h2>`;
  for (const [key, label] of [["declarative", "평서"], ["imperative", "명령"], ["propositive", "청유"], ["exclamatory", "감탄"]]) {
    h += `<h3>${label}형</h3>` + tbl(fe[key].map((x) => ({ form: x.form, env: [x.env, x.modern ? `현대어 ${x.modern}` : "", x.note].filter(Boolean).join(" · ") })));
  }
  h += `<h3>의문형</h3><p class="ex">${esc(fe.interrogative.note)}</p>`
    + tbl(fe.interrogative.items.map((x) => ({ form: x.form, env: [x.type, x.env, x.note].filter(Boolean).join(" · "), examples: x.examples })));
  h += `<h2>연결어미</h2>` + tbl(g.connective_endings.map((x) => ({ form: x.form, env: [x.meaning, x.modern ? `현대어 ${x.modern}` : ""].filter(Boolean).join(" · "), examples: x.examples })));
  h += `<h2>전성어미</h2><h3>명사형</h3>` + tbl(g.transformative_endings.nominal.map((x) => ({ form: x.form, env: [x.modern ? `현대어 ${x.modern}` : "", x.env, x.note].filter(Boolean).join(" · ") })));
  h += `<h3>관형사형</h3>` + tbl(g.transformative_endings.adnominal.map((x) => ({ form: x.form, env: [x.meaning, x.modern ? `현대어 ${x.modern}` : ""].filter(Boolean).join(" · ") })));
  h += `<p class="note">${esc(g.meta.note)}</p>`;
  $("#gram").innerHTML = h;
}

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  $("#lex").classList.toggle("hidden", b.dataset.tab !== "lex");
  $("#gram").classList.toggle("hidden", b.dataset.tab !== "gram");
});
$("#q").addEventListener("input", draw);

Promise.all([
  fetch("data/lexicon.json").then((r) => r.json()),
  fetch("data/grammar.json").then((r) => r.json()),
]).then(([lex, gram]) => {
  LEX = lex; GRAM = gram;
  draw(); drawGram();
}).catch((e) => {
  $("#list").innerHTML = `<p class="note">사전을 불러오지 못했습니다. (${esc(e.message)})</p>`;
});
</script>
</body>
</html>
